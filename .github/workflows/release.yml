name: Build release APK

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Main populates the shared cache; tag/release builds only consume it.
          cache-read-only: ${{ github.event_name == 'release' }}
      - name: Build signed optimized release APK
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}" ./gradlew assembleRelease --no-daemon
          else
            VERSION="${GITHUB_SHA::7}" ./gradlew assembleRelease --no-daemon
          fi
      - name: Upload release artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: myscore-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Give artifacts release-specific names
        if: github.event_name == 'release'
        run: |
          cp app/build/outputs/apk/release/app-release.apk "myscore-${{ github.event.release.tag_name }}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "myscore-${{ github.event.release.tag_name }}-mapping.txt"
      - name: Upload artifacts to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            myscore-${{ github.event.release.tag_name }}.apk
            myscore-${{ github.event.release.tag_name }}-mapping.txt
