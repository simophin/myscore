name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # PRs can reuse main's cache without allowing untrusted branches to update it.
          cache-read-only: true
      - name: Run unit tests
        run: VERSION="${GITHUB_SHA::7}" ./gradlew testDebugUnitTest --no-daemon
